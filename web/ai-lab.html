<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CB Forge AI Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="panel sidebar">
      <div class="hero">
        <div class="eyebrow">CB Forge</div>
        <h1>AI Lab</h1>
        <p class="subtext">Pannello semplice per allenare il baseline AI dalle run reali gia' importate, senza passare dalla console.</p>
        <div class="nav-links">
          <a class="nav-link" href="/">Campioni</a>
          <a class="nav-link" href="/gear">Equip</a>
          <a class="nav-link" href="/build">Build</a>
          <a class="nav-link" href="/optimizer">Optimizer</a>
          <a class="nav-link" href="/clan-boss">Clan Boss</a>
          <a class="nav-link active" href="/ai-lab">AI Lab</a>
          <a class="nav-link" href="/runs">Runs</a>
          <a class="nav-link" href="/sets">Sets</a>
        </div>
      </div>
      <div class="toolbar">
        <select id="aiEncounter"></select>
        <input id="aiOutputPath" type="text" placeholder="Path modello output">
      </div>
      <div id="aiStatus" class="status"></div>
      <div id="aiRoster" class="roster"></div>
    </aside>

    <main class="panel main">
      <section id="aiSummary" class="summary"></section>
      <section class="main-toolbar">
        <button id="aiRefreshBtn" class="ghost">Ricarica Stato</button>
        <button id="aiDatasetBtn" class="ghost">Aggiorna Dataset AI</button>
        <button id="aiCleanupBtn" class="ghost">Pulisci Duplicati</button>
        <button id="aiTrainBtn" class="primary">Allena Modello</button>
      </section>
      <section id="aiDetails" class="details">
        <div class="empty">Caricamento AI Lab in corso.</div>
      </section>
    </main>
  </div>
  <script src="/ailab.js?v=20260418a"></script>
</body>
</html>
