<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CB Forge Optimizer</title>
  <link rel="stylesheet" href="/style.css?v=20260409b">
</head>
<body>
  <div class="shell">
    <aside class="panel sidebar">
      <div class="hero">
        <div class="eyebrow">CB Forge</div>
        <h1>Optimizer</h1>
        <p class="subtext">Vista semplice: solo i 5 campioni scelti e il pulsante per equipaggiarli.</p>
        <div class="nav-links">
          <a class="nav-link" href="/">Campioni</a>
          <a class="nav-link active" href="/optimizer">Optimizer</a>
          <a class="nav-link" href="/runs">Debug</a>
        </div>
      </div>
      <div class="toolbar">
        <select id="optimizerBoss"></select>
        <select id="optimizerAffinity"></select>
        <select id="optimizerLevel"></select>
        <select id="optimizerSource"></select>
      </div>
      <div id="optimizerStatus" class="status"></div>
      <div id="optimizerRoster" class="roster"></div>
    </aside>

    <main class="panel main">
      <section id="optimizerSummary" class="summary"></section>
      <section class="main-toolbar">
        <button id="optimizerReloadBtn" class="primary">Ricalcola proposta</button>
      </section>
      <section id="optimizerDetails" class="details">
        <div class="empty">Caricamento team in corso.</div>
      </section>
    </main>
  </div>
  <script src="/optimizer.js?v=20260409b"></script>
</body>
</html>
