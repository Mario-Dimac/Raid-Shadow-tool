<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CB Forge Roster</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="panel sidebar">
      <div class="hero">
        <div class="eyebrow">CB Forge</div>
        <h1>Campioni</h1>
        <p class="subtext">Vista semplice del roster: solo 6 stelle nella lista, e in dettaglio solo le stats totali.</p>
        <div class="nav-links">
          <a class="nav-link active" href="/">Campioni</a>
          <a class="nav-link" href="/optimizer">Optimizer</a>
          <a class="nav-link" href="/runs">Debug</a>
        </div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Cerca campione...">
      </div>
      <div id="sidebarStatus" class="status"></div>
      <div id="roster" class="roster"></div>
    </aside>

    <main class="panel main">
      <section id="summary" class="summary"></section>
      <section class="main-toolbar">
        <button id="reloadBtn" class="ghost">Ricarica vista</button>
      </section>
      <section id="details" class="details">
        <div class="empty">Seleziona un campione dalla lista per vedere le stats totali.</div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
